  .page {

  /* Header bar */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 16px 18px 10px;
    border-bottom: 1px solid #dddcd8;
    direction: ltr;

    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 400;

    font-size: 20px;
    color: #333;
    font-weight: 700;

  /* Text area — fills the page between header and page number */
  .text-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 16px 26px 0;
  }

  /* Short pages (<15 elements): use fixed gap matching 15-line spacing, content at top */
  .text-area.short-page {
    justify-content: flex-start;
    gap: 36px;
  }

  .text-area.opening-page {

  .opening-page .text-line {

  .opening-page .basmala {

  }
  .opening-page .surah-banner .surah-title {

  /* Each text line — flexbox RTL with space-between for mushaf justification */
  .text-line {
    direction: rtl;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: 'QCF2_P598', serif;
    font-size: 37.2px;
    line-height: 1.0;
    color: #1b1b1b;
    padding: 0 2px;
    font-weight: 400;
  }

  /* Last line of a surah — natural word spacing, not stretched edge-to-edge */
  .text-line.last-line {
    justify-content: center;
    gap: 14px;
  }

  /* Individual word spans */
  .word {
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* Basmala — centered */
  .basmala {
    direction: rtl;
    text-align: center;
    font-family: 'QCF2_P598', serif;
    font-size: 37.2px;
    line-height: 1.0;
    color: #1b1b1b;
    padding: 0 4px;
    font-weight: 400;

  .basmala .qcf {
    white-space: nowrap;
