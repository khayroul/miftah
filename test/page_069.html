  /* Header bar */
  .header {

    gap: 10px;
    padding: 16px 18px 10px;
    border-bottom: 1px solid #dddcd8;

  .text-area {

    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 16px 26px 0;
  }

  /* Short pages (<15 elements): use fixed gap matching 15-line spacing, content at top */
  .text-area.short-page {
    justify-content: flex-start;
    gap: 36px;

    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: 'QCF2_P069', serif;
    font-size: 37.2px;
    line-height: 1.0;
    color: #1b1b1b;
    padding: 0 2px;
    font-weight: 400;
  }

  /* Last line of a surah — natural word spacing, not stretched edge-to-edge */
  .text-line.last-line {
    justify-content: center;
    gap: 14px;
  }

  /* Individual word spans */
  .word {
    white-space: nowrap;
    flex-shrink: 0;
  }

  .basmala {
    direction: rtl;
    text-align: center;
    font-family: 'QCF2_P069', serif;
    font-size: 37.2px;
    line-height: 1.0;
    color: #1b1b1b;
    padding: 0 4px;
    font-weight: 400;
