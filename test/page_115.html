    -moz-osx-font-smoothing: grayscale;
  }

  .page {
    width: 768px;
    height: 1280px;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* Header bar */
  .header {
    display: none;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 10px 10px;
    border-bottom: 2px solid #1b1b1b;
    margin: 10px 10px 15px;
    font-size: 20px;
    color: #1b1b1b;
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
  }
  .header .juz {
    font-size: 17px;
    color: #555;
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    font-weight: 400;
    white-space: nowrap;
  }
  .header .surah-name {
    font-size: 15px;
    color: #555;
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    flex: 1 1 auto;
    min-width: 0;
    direction: rtl;
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 400;
  }
  .header .surah-ar {
    font-family: 'Geeza Pro', 'Traditional Arabic', serif;
    font-size: 20px;
    color: #333;
    font-weight: 700;
  }

  /* Text area — fills the page between header and page number */
  .text-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 16px 26px 0;
  }

  /* Short pages (<15 elements): use fixed gap matching 15-line spacing, content at top */
  .text-area.short-page {
    justify-content: flex-start;
    gap: 36px;
  }

  /* Opening pages (1-2): circular/oval text arrangement — centered, larger font */
  .text-area.opening-page {
    justify-content: center;
    gap: 28px;
    padding: 0 60px;
  }
  .opening-page .text-line {
    justify-content: center;
    gap: 12px;
    font-size: 54px;
  }
  .opening-page .basmala {
    font-size: 54px;
  }
  .opening-page .surah-banner .surah-title {
    font-size: 56px;
  }

  /* Each text line — flexbox RTL with space-between for mushaf justification */
  .text-line {
    direction: rtl;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: 'QCF2_P115', serif;
    font-size: 37.2px;
    line-height: 1.0;
    color: #1b1b1b;
    padding: 0 2px;
    font-weight: 400;
  }

  /* Last line of a surah — natural word spacing, not stretched edge-to-edge */
  .text-line.last-line {
    justify-content: center;
    gap: 14px;
  }

  /* Individual word spans */
  .word-group {
    white-space: nowrap;
    flex-shrink: 0;
    display: inline-flex;
    align-items: baseline;
  }
  .word, .sign {
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* Basmala — centered */
  .basmala {
    direction: rtl;
    text-align: center;
    font-family: 'QCF2_P115', serif;
    font-size: 37.2px;
    line-height: 1.0;
    color: #1b1b1b;
    padding: 0 4px;
    font-weight: 400;
  }

  .basmala .qcf {
    white-space: nowrap;
    font-family: 'QCF2_BSML', 'QCF2_P115', serif;
  }

  /* Surah banner — ornamental frame with calligraphic surah name */
  .surah-banner {
    text-align: center;
    direction: ltr;
    padding: 0;
    margin: 12px 0 4px;
  }
