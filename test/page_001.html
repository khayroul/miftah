  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 768px;
    height: 1280px;
    background: #ffffff;
    overflow: hidden;
    font-family: sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .page {
    width: 768px;
    height: 1280px;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* Header bar */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 18px 28px 12px;
    border-bottom: 1px solid #e0e0e0;
    direction: ltr;
  }
  .header .juz {
    font-size: 18px;
    color: #666;
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    font-weight: 400;
  }
  .header .surah-name {
    font-size: 18px;
    color: #666;
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    direction: rtl;
    font-weight: 400;
  }
  .header .surah-ar {
    font-family: 'Geeza Pro', 'Traditional Arabic', serif;
    font-size: 24px;
    color: #333;
    font-weight: 700;
  }

  /* Text area — fills the page between header and page number */
  .text-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 20px 28px 0;
  }

  /* Short pages (<15 elements): use fixed gap matching 15-line spacing, content at top */
  .text-area.short-page {
    justify-content: flex-start;
    gap: 41px;
  }

  /* Opening pages (1-2): circular/oval text arrangement — centered, larger font */
  .text-area.opening-page {

  }

  .text-line {
    direction: rtl;

    justify-content: space-between;
    align-items: baseline;
    font-family: 'QCF2_P001', serif;
    font-size: 40px;

  .word {

  /* Surah banner — ornamental frame with calligraphic surah name */
  .surah-banner {
    text-align: center;
    direction: ltr;
    padding: 0;
    margin: 2px 12px;
  }
  .surah-banner .surah-frame {
    display: inline-block;
    position: relative;
    padding: 6px 40px;
    border: 2.5px solid #1a1a1a;
    border-radius: 4px;
    min-width: 85%;
  }
  .surah-banner .surah-frame::before {
    content: '';
    position: absolute;
    top: 3px; left: 3px; right: 3px; bottom: 3px;
    border: 1px solid #1a1a1a;
    border-radius: 2px;
    opacity: 0.5;
  }
  /* Decorative endcaps — left and right */
  .surah-banner .surah-frame::after {
    content: '';
    position: absolute;
    top: -6px; bottom: -6px;
    left: 12px; right: 12px;
    border-left: 8px solid #ffffff;
    border-right: 8px solid #ffffff;
    pointer-events: none;
  }
  .surah-banner .surah-icon {
    font-family: 'surah_names', serif;
    font-size: 68px;
    color: #1a1a1a;
    line-height: 1.0;
    position: relative;
    z-index: 1;
  }

  /* Page number */
  .page-number {
    text-align: center;
    padding: 6px 0 14px;
    font-size: 18px;
    color: #999;
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
  }
</style>
