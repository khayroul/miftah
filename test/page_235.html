    justify-content: space-between;
    align-items: baseline;
    font-family: 'QCF2_P235', serif;
    font-size: 37.2px;
    line-height: 1.0;
    color: #1b1b1b;
    padding: 0 2px;
    font-weight: 400;

  .text-line.last-line {
    justify-content: center;
    gap: 14px;

    white-space: nowrap;
    flex-shrink: 0;

    text-align: center;
    font-family: 'QCF2_P235', serif;
    font-size: 37.2px;
    line-height: 1.0;
