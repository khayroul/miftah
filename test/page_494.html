  .text-area.short-page {

    justify-content: space-between;

    font-family: 'QCF2_P494', serif;
    font-size: 37.2px;
    line-height: 1.0;
    color: #1b1b1b;
    padding: 0 2px;
    font-weight: 400;
  }

  /* Last line of a surah — natural word spacing, not stretched edge-to-edge */
  .text-line.last-line {
    justify-content: center;
    gap: 14px;

    white-space: nowrap;
    flex-shrink: 0;

  .basmala {
    direction: rtl;
    text-align: center;
    font-family: 'QCF2_P494', serif;
    font-size: 37.2px;
    line-height: 1.0;

    padding: 0 4px;
