<!DOCTYPE html>
<html lang="ms" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1a1a2e" />
  <title>Miftah — Luar Talian</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.25rem; margin-bottom: 0.5rem; color: #ffffff; }
    p { font-size: 0.9rem; line-height: 1.5; color: #a0a0b0; margin-bottom: 1.5rem; }
    .retry-btn {
      display: inline-block;
      padding: 0.6rem 1.5rem;
      background: #4a90d9;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
    }
    .retry-btn:hover { background: #357abd; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📖</div>
    <h1>Anda sedang luar talian</h1>
    <p>
      Muat turun surah untuk bacaan luar talian.
      Buka Miftah semasa dalam talian untuk muat turun.
    </p>
    <a href="/" class="retry-btn">Cuba semula</a>
  </div>
  <script>
    window.addEventListener('online', function() {
      window.location.href = '/';
    });
  </script>
</body>
</html>
